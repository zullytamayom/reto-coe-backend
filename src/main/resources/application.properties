spring.application.name=reto-aprobaciones
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_aprobaciones}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8081
server.servlet.context-path=/api

# Configuración segura para el cliente de AWS LocalStack
reto.aws.access-key=${CONFIG_AWS_ACCESS_KEY:test_key_banco_local}
reto.aws.secret-key=${CONFIG_AWS_SECRET_KEY:test_secret_banco_local}

